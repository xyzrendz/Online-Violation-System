<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password | Online Violation System</title>
    <style>
      :root {
        --primary: #0e918c;
        --secondary: #f9f9f9;
        --accent: #14b8a6;
        --text: #1f2937;
        --muted: #6b7280;
        --card: #ffffff;
        --shadow: rgba(0, 0, 0, 0.08);
        --danger: #ef4444;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", Arial, sans-serif;
        background-color: var(--secondary);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        animation: fadeIn 0.5s ease;
      }

      .reset-container {
        background-color: var(--card);
        padding: 32px 40px;
        border-radius: 12px;
        box-shadow: 0 6px 20px var(--shadow);
        width: 100%;
        max-width: 420px;
        text-align: center;
      }

      h2 {
        color: var(--primary);
        margin-bottom: 16px;
        font-size: 1.6rem;
      }

      p {
        color: var(--muted);
        font-size: 0.95rem;
        margin-bottom: 24px;
      }

      .form-group {
        text-align: left;
        margin-bottom: 16px;
      }

      label {
        display: block;
        color: var(--text);
        font-weight: 600;
        margin-bottom: 6px;
        font-size: 0.9rem;
      }

      input[type="password"] {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 0.95rem;
        transition: border 0.3s;
      }

      input[type="password"]:focus {
        border-color: var(--accent);
        outline: none;
      }

      .reset-button {
        width: 100%;
        background-color: var(--primary);
        color: white;
        border: none;
        border-radius: 10px;
        padding: 12px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.3s ease, transform 0.1s ease;
        margin-top: 8px;
      }

      .reset-button:hover {
        background-color: var(--accent);
        transform: translateY(-2px);
      }

      .back-link {
        display: block;
        margin-top: 18px;
        text-align: center;
        color: var(--primary);
        font-weight: 500;
        text-decoration: none;
        font-size: 0.9rem;
      }

      .back-link:hover {
        text-decoration: underline;
      }

      .message {
        margin-top: 14px;
        font-size: 0.9rem;
      }

      .success {
        color: #22c55e;
      }

      .error {
        color: var(--danger);
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <div class="reset-container">
      <h2>Reset Your Password</h2>
      <p>Please enter and confirm your new password below.</p>

      <form id="resetForm">
        <div class="form-group">
          <label for="new-password">New Password</label>
          <input type="password" id="new-password" required />
        </div>

        <div class="form-group">
          <label for="confirm-password">Confirm Password</label>
          <input type="password" id="confirm-password" required />
        </div>

        <button type="submit" class="reset-button">Reset Password</button>
      </form>

      <p id="message" class="message"></p>
      <a href="login.html" class="back-link">← Back to Login</a>
    </div>

    <script>
      const username = localStorage.getItem("resetUsername");
      const email = localStorage.getItem("resetEmail");
      const code = localStorage.getItem("resetCode");
      if (!email || !code) window.location.href = "forgot-password.html";

      document.getElementById("resetForm").onsubmit = async (e) => {
        e.preventDefault();
        const message = document.getElementById("message");
        message.textContent = "";

        const newPassword = document.getElementById("new-password").value;
        const confirm = document.getElementById("confirm-password").value;

        if (newPassword !== confirm) {
          message.textContent = "⚠️ Passwords do not match.";
          message.className = "message error";
          return;
        }

        message.textContent = "Processing...";
        message.className = "message";

        const res = await fetch("/api/auth/reset-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, username, code, newPassword }),
        });

        const data = await res.json();
        if (res.ok) {
          message.textContent = "✅ Password reset successful! Redirecting...";
          message.className = "message success";
          
          localStorage.removeItem("resetEmail");
          localStorage.removeItem("resetUsername");
          localStorage.removeItem("resetCode");
          setTimeout(() => (window.location.href = "login.html"), 2000);
        } else {
          message.textContent = "❌ " + (data.error || "Reset failed.");
          message.className = "message error";
        }
      };
    </script>
  </body>
</html>
