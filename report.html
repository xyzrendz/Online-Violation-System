<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Report | Online Violation System</title>
    <script src="https://unpkg.com/feather-icons"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <style>
      :root {
        --primary: #0e918c;
        --secondary: #f9f9f9;
        --accent: #14b8a6;
        --text: #1f2937;
        --muted: #6b7280;
        --card: #ffffff;
        --shadow: rgba(0, 0, 0, 0.09);
        --input-bg: #f5f5f5;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", Arial, sans-serif;
        background-color: var(--secondary);
        color: var(--text);
        transition: 0.3s;
      }

      body.dark-mode {
        --secondary: #1a1a1a;
        --text: #f1f1f1;
        --card: #262626;
        --muted: #bbbbbb;
        --input-bg: #333333;
        --shadow: rgba(255, 255, 255, 0.08);
      }

      header {
        background: var(--primary);
        color: white;
        position: sticky;
        top: 0;
        z-index: 10;
        box-shadow: 0 2px 8px var(--shadow);
        padding: 10px 20px;
      }

      .header-container {
        display: flex;
        align-items: center;
        justify-content: space-between;
        max-width: 1200px;
        margin: 0 auto;
      }

      .header-container h1 {
        margin: 0;
        font-size: 1.5rem;
      }

      .header-left {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      
      .back-btn,
      .dark-mode-btn {
        background: rgba(255, 255, 255, 0.2);
        border: none;
        border-radius: 6px;
        padding: 6px 12px;
        cursor: pointer;
        color: white;
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 0.9rem;
        transition: background 0.2s, color 0.2s;
      }

      .back-btn:hover,
      .dark-mode-btn:hover {
        background: rgba(255, 255, 255, 0.35);
      }

      main {
        max-width: 900px;
        margin: 45px auto;
        padding: 0 20px;
        animation: fadeIn 0.5s ease;
      }

      .description-card {
        background: var(--card);
        padding: 32px;
        border-radius: 16px;
        box-shadow: 0 6px 20px var(--shadow);
        text-align: center;
        transition: 0.3s;
      }

      .description-card h2 {
        margin: 0 0 10px;
        font-size: 1.8rem;
        color: var(--primary);
      }

      .description-card p {
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.6;
      }

      .open-modal-btn {
        margin-top: 20px;
        padding: 12px 22px;
        font-size: 1.1rem;
        border: none;
        border-radius: 10px;
        background: var(--accent);
        color: white;
        cursor: pointer;
        transition: 0.3s;
      }

      .open-modal-btn:hover {
        background: #0d7f79;
      }

      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.55);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 1000;
        overflow-y: auto;
        padding: 20px;
      }

      .modal {
        width: 100%;
        max-width: 580px;
        background: var(--card);
        padding: 32px;
        border-radius: 16px;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        animation: scaleIn 0.25s ease;
        position: relative;
        transition: 0.3s;
      }

      .close-btn {
        position: absolute;
        top: 18px;
        right: 18px;
        background: none;
        border: none;
        font-size: 1.8rem;
        cursor: pointer;
        color: var(--muted);
      }

      .modal h3 {
        margin: 0 0 20px;
        text-align: center;
        color: var(--primary);
        font-size: 1.6rem;
      }

      .modal .back-btn {
        background: #ddd;
        color: #1f2937;
        transition: 0.3s;
      }

      body.dark-mode .modal .back-btn {
        background: rgba(255, 255, 255, 0.2);
        color: white;
      }

      input,
      select,
      textarea {
        width: 100%;
        padding: 12px;
        margin-top: 6px;
        margin-bottom: 20px;
        border-radius: 10px;
        border: 1px solid #d1d5db;
        background: var(--input-bg);
        color: var(--text);
        font-size: 1rem;
        transition: border 0.2s;
      }

      input:focus,
      select:focus,
      textarea:focus {
        border: 1px solid var(--primary);
        outline: none;
      }

      label {
        font-size: 0.95rem;
        font-weight: 600;
        color: var(--text);
      }

      .form-step {
        display: none;
        padding-right: 24px;
      }
      .form-step.active {
        display: block;
        animation: fadeIn 0.3s ease;
      }

      .step-buttons {
        display: flex;
        justify-content: space-between;
        margin-top: 10px;
      }

      .next-btn,
      .back-btn {
        padding: 12px 20px;
        border-radius: 10px;
        border: none;
        cursor: pointer;
        font-size: 1rem;
      }
      .next-btn {
        background: var(--primary);
        color: white;
      }

      #spinner {
        border: 4px solid #ccc;
        border-top: 4px solid var(--primary);
        border-radius: 50%;
        width: 34px;
        height: 34px;
        animation: spin 0.7s linear infinite;
        display: none;
        margin: 15px auto;
      }

      .file-drop-area {
        border: 2px dashed var(--primary);
        border-radius: 12px;
        margin-top: 16px;
        padding: 30px;
        text-align: center;
        cursor: pointer;
        transition: background 0.2s, border-color 0.2s;
        position: relative;
        margin-bottom: 10px;
      }

      .file-drop-area:hover {
        background: rgba(14, 145, 140, 0.05);
        border-color: var(--accent);
      }

      .file-drop-area input[type="file"] {
        position: absolute;
        width: 100%;
        height: 100%;
        opacity: 0;
        cursor: pointer;
        top: 0;
        left: 0;
      }

      .file-drop-area span {
        font-size: 1rem;
        color: var(--muted);
      }

      .preview-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-top: 10px;
      }

      #preview {
        max-width: 300px;
        max-height: 100px;
        border-radius: 12px;
        object-fit: cover;
        display: none;
        box-shadow: 0 4px 12px var(--shadow);
        margin-bottom: 5px;
      }

      #fileName {
        font-size: 0.9rem;
        color: var(--text);
        margin-bottom: 5px;
      }

      .remove-file-btn {
        background: #e53e3e;
        color: white;
        border: none;
        padding: 5px 12px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 0.85rem;
        transition: background 0.2s;
      }

      .remove-file-btn:hover {
        background: #c53030;
      }

      footer {
        text-align: center;
        padding: 14px;
        margin-top: 40px;
        color: var(--muted);
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes scaleIn {
        from {
          opacity: 0;
          transform: scale(0.9);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes spin {
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <header>
      <div class="header-container">
        <div class="header-left">
          <button class="back-btn" id="back-btn">
            <i class="fa-solid fa-arrow-left-long"></i>
          </button>
        </div>
        <h1>Report</h1>
        <div class="header-right">
          <button class="dark-mode-btn" id="dark-mode-toggle">
            <i class="fa-solid fa-moon" id="dark-mode-icon"></i> Dark Mode
          </button>
        </div>
      </div>
    </header>

    <main>
      <div class="description-card">
        <h2>Submit a Violation Report</h2>
        <p>
          Allows officers and authorized personnel to submit detailed
          violation reports, including incident information and optional image
          evidence.
        </p>
        <button class="open-modal-btn" id="openModal">
          <i class="fa fa-file-circle-plus"></i> Submit a Report
        </button>
      </div>
    </main>

    <div class="modal-backdrop" id="modalBackdrop">
      <div class="modal">
        <button class="close-btn" id="closeModal">&times;</button>
        <h3>Violation Report Form</h3>

        <div class="spinner" id="spinner"></div>

        <form id="reportForm" enctype="multipart/form-data">
          <div class="form-step active">
            <label>
              <i class="fa-solid fa-user"></i>
              Violator Full Name
            </label>
            <input
              type="text"
              id="violator_name"
              placeholder="Enter full name"
              required
            />
            <label>
              <i class="fa-solid fa-exclamation-triangle"></i>
              Violation Type
            </label>
            <select id="violation_type" required>
              <option value="">Select type...</option>
              <option>No Helmet</option>
              <option>No License</option>
              <option>Illegal Parking</option>
              <option>Overspeeding</option>
              <option>Counterflow</option>
              <option>No Seatbelt</option>
              <option>Reckless Driving</option>
              <option>Illegal U-Turn</option>
              <option>Using Mobile While Driving</option>
            </select>
            <label>
              <i class="fa-solid fa-calendar-days"></i>
              Incident Date
            </label>
            <input type="date" id="incident_date" required />
            <label>
              <i class="fa-solid fa-peso-sign"></i>
              Charges
            </label>
            <input
              type="number"
              id="payment_amount"
              placeholder="Enter charges amount"
              required
            />
            <div class="step-buttons">
              <button type="button" class="next-btn">
                <i class="fa-solid fa-arrow-right"></i>
                Next
              </button>
            </div>
          </div>

          <div class="form-step">
            <label>
              <i class="fa-solid fa-location-dot"></i>
              Location
            </label>
            <input
              type="text"
              id="location"
              placeholder="Where did it happen?"
              required
            />
            <label>
              <i class="fa-solid fa-file-lines"></i>
              Description
            </label>
            <textarea
              id="description"
              rows="4"
              placeholder="Describe the incident..."
              required
            ></textarea>
            <div class="step-buttons">
              <button type="button" class="back-btn">
                <i class="fa-solid fa-arrow-left"></i>
                Back
              </button>
              <button type="button" class="next-btn">
                <i class="fa-solid fa-arrow-right"></i>
                Next
              </button>
            </div>
          </div>

          <div class="form-step">
            <label>
              <i class="fa-solid fa-user-pen"></i>
              Reporter Name (optional)
            </label>
            <input type="text" id="reporter_name" />
            <label>
              <i class="fa-solid fa-phone"></i>
              Contact (optional)
            </label>
            <input type="text" id="reporter_contact" />

            <label>
              <i class="fa-solid fa-upload"></i>
              Upload Evidence (optional)
            </label>
            <div class="file-drop-area" id="fileDropArea">
              <span>Drag & Drop or Click to Upload</span>
              <input type="file" id="evidence" accept="image/*" />
            </div>

            <div class="preview-container">
              <img id="preview" alt="Preview" />
              <div id="fileName"></div>
              <button
                type="button"
                class="remove-file-btn"
                id="removeFileBtn"
                style="display: none"
              >
                Remove File
              </button>
            </div>

            <div class="step-buttons">
              <button type="button" class="back-btn">
                <i class="fa-solid fa-arrow-left"></i>
                Back
              </button>
              <button type="submit" class="next-btn">
                <i class="fa-solid fa-paper-plane"></i>
                Submit Report
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>

    <footer>© 2025 Online Violation Reporting System</footer>

    <script>
      feather.replace();

      document.getElementById("back-btn").onclick = () => window.history.back();

      const darkToggle = document.getElementById("dark-mode-toggle");
      if (localStorage.getItem("darkMode") === "enabled") {
        document.body.classList.add("dark-mode");
        darkToggle.innerHTML = `<i class="fa-solid fa-sun"></i> Light Mode`;
      }
      darkToggle.addEventListener("click", () => {
        document.body.classList.toggle("dark-mode");
        if (document.body.classList.contains("dark-mode")) {
          darkToggle.innerHTML = `<i class="fa-solid fa-sun"></i> Light Mode`;
          localStorage.setItem("darkMode", "enabled");
        } else {
          darkToggle.innerHTML = `<i class="fa-solid fa-moon"></i> Dark Mode`;
          localStorage.setItem("darkMode", "disabled");
        }
      });

      const modalBackdrop = document.getElementById("modalBackdrop");
      document.getElementById("openModal").onclick = () =>
        (modalBackdrop.style.display = "flex");
      document.getElementById("closeModal").onclick = () =>
        (modalBackdrop.style.display = "none");

      const steps = document.querySelectorAll(".form-step");
      let currentStep = 0;
      document.querySelectorAll(".next-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          if (currentStep < steps.length - 1) {
            steps[currentStep].classList.remove("active");
            currentStep++;
            steps[currentStep].classList.add("active");
          }
        });
      });
      document.querySelectorAll(".back-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          if (currentStep > 0) {
            steps[currentStep].classList.remove("active");
            currentStep--;
            steps[currentStep].classList.add("active");
          }
        });
      });

      const fileDropArea = document.getElementById("fileDropArea");
      const fileInput = document.getElementById("evidence");
      const preview = document.getElementById("preview");
      const fileNameDiv = document.getElementById("fileName");
      const removeFileBtn = document.getElementById("removeFileBtn");

      function handleFile(file) {
        if (file && file.type.startsWith("image/")) {
          preview.src = URL.createObjectURL(file);
          preview.style.display = "block";
          fileNameDiv.textContent = file.name;
          removeFileBtn.style.display = "inline-block";
        }
      }

      fileDropArea.addEventListener("dragover", (e) => {
        e.preventDefault();
        fileDropArea.style.background = "rgba(14,145,140,0.1)";
      });
      fileDropArea.addEventListener("dragleave", (e) => {
        e.preventDefault();
        fileDropArea.style.background = "transparent";
      });
      fileDropArea.addEventListener("drop", (e) => {
        e.preventDefault();
        fileDropArea.style.background = "transparent";
        const file = e.dataTransfer.files[0];
        if (file) {
          fileInput.files = e.dataTransfer.files;
          handleFile(file);
        }
      });
      fileInput.addEventListener("change", (e) => {
        handleFile(e.target.files[0]);
      });
      removeFileBtn.addEventListener("click", () => {
        fileInput.value = "";
        preview.src = "";
        preview.style.display = "none";
        fileNameDiv.textContent = "";
        removeFileBtn.style.display = "none";
      });

      const form = document.getElementById("reportForm");
      form.onsubmit = async (e) => {
        e.preventDefault();
        document.getElementById("spinner").style.display = "block";

        const formData = new FormData();
        formData.append(
          "payment_amount",
          document.getElementById("payment_amount").value
        );
        formData.append(
          "violator_name",
          document.getElementById("violator_name").value
        );
        formData.append(
          "violation_type",
          document.getElementById("violation_type").value
        );
        formData.append(
          "reporter_name",
          document.getElementById("reporter_name").value
        );
        formData.append(
          "reporter_contact",
          document.getElementById("reporter_contact").value
        );
        formData.append(
          "incident_date",
          document.getElementById("incident_date").value
        );
        formData.append("location", document.getElementById("location").value);
        formData.append(
          "description",
          document.getElementById("description").value
        );

        const file = fileInput.files[0];
        if (file) formData.append("evidence", file);

        const token = localStorage.getItem("token");
        const res = await fetch("/api/report", {
          method: "POST",
          headers: { authorization: token ? "Bearer " + token : "" },
          body: formData,
        });
        const result = await res.json();

        setTimeout(() => {
          alert(
            res.ok && result.ok
              ? "Report submitted successfully!"
              : "Failed to submit report!"
          );
          document.getElementById("spinner").style.display = "none";
          modalBackdrop.style.display = "none";
          form.reset();
          steps.forEach((s) => s.classList.remove("active"));
          steps[0].classList.add("active");
          preview.style.display = "none";
          fileNameDiv.textContent = "";
          removeFileBtn.style.display = "none";
          currentStep = 0;
        }, 1500);
      };
    </script>
  </body>
</html>
