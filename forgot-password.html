<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/css/all.min.css" />
    <title>Forgot Password | Online Violation System</title>

    <style>
      :root {
        --primary: #0e918c;
        --secondary: #f9f9f9;
        --accent: #14b8a6;
        --text: #1f2937;
        --muted: #6b7280;
        --card: #ffffff;
        --shadow: rgba(0, 0, 0, 0.08);
      }

      body {
        margin: 0;
        font-family: "Segoe UI", Arial, sans-serif;
        background-color: var(--secondary);
        color: var(--text);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      form {
        padding-right: 26px;
      }

      .container {
        background-color: var(--card);
        padding: 40px 30px;
        border-radius: 16px;
        box-shadow: 0 8px 24px var(--shadow);
        width: 100%;
        max-width: 420px;
        animation: fadeIn 0.4s ease;
      }

      h2 {
        text-align: center;
        color: var(--primary);
        font-size: 1.6rem;
        margin-bottom: 10px;
      }

      p.subtitle {
        text-align: center;
        color: var(--muted);
        font-size: 0.95rem;
        margin-bottom: 25px;
      }

      label {
        display: block;
        font-weight: 500;
        color: var(--text);
        margin-bottom: 8px;
      }

      input[type="email"],
      input[type="text"] {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 15px;
        transition: border-color 0.2s, box-shadow 0.2s;
      }

      input[type="email"]:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(14, 145, 140, 0.2);
        outline: none;
      }

      button {
        width: 100%;
        margin-top: 20px;
        padding: 12px;
        background-color: var(--primary);
        color: white;
        font-size: 1rem;
        font-weight: 600;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: background 0.3s;
      }

      button:hover {
        background-color: #0d7f79;
      }

      .message {
        margin-top: 16px;
        text-align: center;
        font-weight: 500;
        font-size: 0.95rem;
      }

      .back-link {
        display: block;
        text-align: center;
        margin-top: 20px;
        color: var(--primary);
        text-decoration: none;
        font-weight: 500;
      }

      .back-link:hover {
        text-decoration: underline;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Forgot Password</h2>
      <p class="subtitle">
        Enter your email and username to receive a verification code.
      </p>

      <form id="forgotPasswordForm">
        <label for="email">
          <i class="fa fa-user"></i>
          Username
        </label>
        <input
          type="text"
          id="username"
          name="username"
          placeholder="Enter your username"
          required
        />
        <label for="email">
          <i class="fa fa-envelope"></i>
          Email Address
        </label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="example@domain.com"
          required
        />
        <button type="submit">
          <i class="fa fa-paper-plane"></i>
          Send Verification Code
        </button>
      </form>

      <div class="message" id="message"></div>

      <a href="login.html" class="back-link">
        <i class="fa fa-arrow-left"></i>
        Back to Login
      </a>
    </div>

    <script>
      document
        .getElementById("forgotPasswordForm")
        .addEventListener("submit", async (event) => {
          event.preventDefault();
          const username = document.getElementById("username").value;
          const email = document.getElementById("email").value;
          const message = document.getElementById("message");

          message.style.color = "#6b7280";
          message.textContent = "📨 Sending verification code...";

          try {
            const res = await fetch("/api/auth/forgot-password", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ email }),
            });

            const data = await res.json();

            if (res.ok) {
              message.style.color = "#22c55e";
              message.textContent = "✅ Code sent! Please check your email.";
              setTimeout(() => {
                localStorage.setItem("resetUsername", username);
                localStorage.setItem("resetEmail", email);
                window.location.href = "verify-code.html";
              }, 2000);
            } else {
              message.style.color = "#ef4444";
              message.textContent =
                "❌ " + (data.error || "Failed to send code.");
            }
          } catch (err) {
            message.style.color = "#ef4444";
            message.textContent = "❌ Network error. Please try again.";
          }
        });
    </script>
  </body>
</html>
